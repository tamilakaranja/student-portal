<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Resources</title>
    <link rel="stylesheet" href="learning-resources.css">
</head>
<body>
    
<!-- top-bar  -->
   <header class="topbar">
        <div class="dashboard-logo">
            <img src="Images/logo.png" alt="School logo">
            <div>
                <div class="school-name">St Genevieve Academy</div>
                <div class="sub-name">Students portal</div>
            </div>
        </div>  


        <!-- actions  -->
           <div class="top-bar-actions">
            <a href="profile.html">My profile</a>
            <a href="index.html">Sign out</a>
        </div>
    </header>
<main class="dashboard">
    <!-- back to dashboard  -->
  <a href="dashboard.html" class="back-link"> Back to dashboard</a>


<!-- filters  -->
        <div class="filters">
            <button type="button" class="filter is-active" data-subject="all">All</button>
            <button type="button" class="filter" data-subject="Mathematics">Mathematics</button>
            <button type="button" class="filter" data-subject="English">English</button>
            <button type="button" class="filter" data-subject="Science">Science</button>
            <button type="button" class="filter" data-subject="Social Studies">Social Studies</button>
        </div>
 
        <div class="videos-layout">
 
            <div class="videos-main">
 
<!-- videos  -->
  <section class="video-card">
                    <div class="video-box" id="video-box">
                        <span class="play">Play</span>
                        <p>Video coming soon</p>
                    </div>
 
                    <p class="video-subject" id="video-subject">Mathematics</p>
                    <div class="video-row">
                        <h2 id="video-title">Understanding fractions</h2>
                        <button type="button" class="watched-btn" id="watched-btn">Mark as watched</button>
                    </div>
                    <p class="video-details" id="video-details">6 min Video lesson</p>
                </section>





</body>
</html>
