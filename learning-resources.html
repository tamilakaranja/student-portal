<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Resources</title>
    <link rel="stylesheet" href="learning-resources.css">
</head>
<body>
    
<!-- top-bar  -->
   <header class="topbar">
        <div class="dashboard-logo">
            <img src="Images/logo.png" alt="School logo">
            <div>
                <div class="school-name">St Genevieve Academy</div>
                <div class="sub-name">Students portal</div>
            </div>
        </div>  


        <!-- actions  -->
           <div class="top-bar-actions">
            <a href="profile.html">My profile</a>
            <a href="index.html">Sign out</a>
        </div>
    </header>
<main class="dashboard">
    <!-- back to dashboard  -->
  <a href="dashboard.html" class="back-link"> Back to dashboard</a>


<!-- filters  -->
        <div class="filters">
            <button type="button" class="filter is-active" data-subject="all">All</button>
            <button type="button" class="filter" data-subject="Mathematics">Mathematics</button>
            <button type="button" class="filter" data-subject="English">English</button>
            <button type="button" class="filter" data-subject="Science">Science</button>
            <button type="button" class="filter" data-subject="Social Studies">Social Studies</button>
        </div>
 
        <div class="videos-layout">
 
            <div class="videos-main">
 
<!-- videos  -->
  <section class="video-card">
                    <div class="video-box" id="video-box">
                        <span class="play">Play</span>
                        <p>Video coming soon</p>
                    </div>
 
                    <p class="video-subject" id="video-subject">Mathematics</p>
                    <div class="video-row">
                        <h2 id="video-title">Understanding fractions</h2>
                        <button type="button" class="watched-btn" id="watched-btn">Mark as watched</button>
                    </div>
                    <p class="video-details" id="video-details">6 min Video lesson</p>
                </section>

<!-- notes  -->

<section class="notes-card">
                    <div class="notes">
                        <div>
                            <h2>My notes</h2>
                            <p class="card-sub">Write down what you learn as you watch.</p>
                        </div>
                    </div>
 
                    <textarea id="notes" placeholder="Type your notes here..."></textarea>
 
                    <div class="notes-bottom">
                        <span id="word-count">0 words</span>
                        <button type="button" class="clear-btn" id="clear-notes">Clear notes</button>
                    </div>
                </section>
 
            </div>
            
            <!-- list of videos  -->
    <aside class="playlist-card">
                <h2>Up next</h2>
                <p class="card-sub">Pick a video to watch</p>


  <button type="button" class="video-item is-active" data-subject="Mathematics" data-title="Understanding fractions" data-minutes="6" data-youtube="grnP3mduZkM">
                    <span>
                        <span class="video-name">Understanding fractions</span>
                        <span class="video-content">Mathematics, 6 min</span>
                    </span>
                </button>

              <button type="button" class="video-item" data-subject="Mathematics" data-title="Adding fractions" data-minutes="8" data-youtube="Iv4F-YV0TxY">
                    <span>
                        <span class="video-name">Adding fractions</span>
                        <span class="video-content">Mathematics, 8 min</span>
                    </span>
                </button>           
 <button type="button" class="video-item" data-subject="English" data-title="Writing a paragraph" data-minutes="5" data-youtube="sZ1DL6a1p8A">
                    
                    <span>
                        <span class="video-name">Writing a paragraph</span>
                        <span class="video-content">English ,5 min</span>
                    </span>
                </button>

                   <button type="button" class="video-item" data-subject="Science" data-title="The life cycle of a plant" data-minutes="7" data-youtube="wqZRGHva1iE">
              
                    <span>
                        <span class="video-name">The life cycle of a plant</span>
                        <span class="video-content">Science, 7 min</span>
                    </span>
                </button>

                           <button type="button" class="video-item" data-subject="Social Studies" data-title="Reading a map" data-minutes="6" data-youtube="">
                    
                    <span>
                        <span class="video-name">Reading a map</span>
                        <span class="video-content">Social Studies, 6 min</span>
                    </span>
                </button>
            </aside>
 
        </div>
    </main>






 <script src="learning-resources.js"></script>

</body>


</html>
