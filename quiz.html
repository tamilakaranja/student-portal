<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
 <!-- top-bar  -->
   <header class="topbar">
        <div class="dashboard-logo">
            <img src="Images/logo.png" alt="School logo">
            <div>
                <div class="school-name">St Genevieve Academy</div>
                <div class="sub-name">Students portal</div>
            </div>
        </div>  


        <!-- actions  -->
           <div class="top-bar-actions">
            <a href="profile.html">My profile</a>
            <a href="index.html">Sign out</a>
        </div>
    </header>
<main class="dashboard">
    <!-- back to dashboard  -->
  <a href="dashboard.html" class="back-link"> Back to dashboard</a>

  <!-- question screen  -->
 
        <section class="quiz-area" id="quiz-screen">
 
            <div class="quiz-info">
                <p class="quiz-subject" id="quiz-subject">Mathematics,Fractions practice test</p>
                <p class="quiz-timer" id="quiz-timer">10:00 left</p>
            </div>

  <!-- Add prohress section  -->
 <div class="progress">
                <div class="progress-content" id="progress-content"></div>
            </div>
            <p class="question-count" id="question-count">Question 1 of 10</p>


 <!-- question box  -->
 <div class="question-box">
                <h1 id="question-text">Question appears here</h1>
                <div id="options"></div>
            </div>
<!-- buttons  -->
  <div class="quiz-nav">
                <button type="button" class="nav-btn nav-btn-outline" id="prev-btn">Previous</button>
                <button type="button" class="nav-btn" id="next-btn">Next question</button>
            </div>
 
        </section>




</body>
</html>
