<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My profile</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
   
    <!-- topbar  -->
     
     <header class="topbar">

 <div class="dashboard-logo">
            <img src="Images/logo.png" alt="School logo">
            <div>  
            <div class="school-name">St Genevieve Academy</div>
            <div class="sub-name">Students portal</div>
            </div>
</div>
        <!-- actions -->
<div class="top-bar-actions"> 
<a href="profile.html">My profile</a>
<a href="index.html">Signout</a>
</div>
</header>

<!-- main section  -->
    <main class="profile-container">

        <section class="page-heading">
            <h1>My Profile</h1>
            <p>View and manage your student information.</p>
        </section>

        <!-- profile overview  -->
        <section class="profile-overview">

            <div class="profile-avatar">
                <span>ST</span>
            </div>

            <div class="profile-intro">
                <h2>Student Name</h2>
                <p>Student ID: STU001</p>
                <span class="status">Active Student</span>
            </div>

        </section>

       <!-- personal info  -->
        <section class="profile-section">

            <div class="section-heading">
                <h2>Personal Information</h2>
            </div>

            <div class="profile-details">

                <div class="detail-item">
                    <label>Full Name</label>
                    <p>Student Name</p>
                </div>

                <div class="detail-item">
                    <label>Email Address</label>
                    <p>student@example.com</p>
                </div>

                <div class="detail-item">
                    <label>Student ID</label>
                    <p>STU001</p>
                </div>

                <div class="detail-item">
                    <label>Grade</label>
                    <p>Grade 8</p>
                </div>

            </div>

        </section>

        <!-- Academic information -->
        <section class="profile-section">

            <div class="section-heading">
                <h2>Academic Information</h2>
            </div>

            <div class="profile-details">

                <div class="detail-item">
                    <label>Current Term</label>
                    <p>Term 1</p>
                </div>

                <div class="detail-item">
                    <label>Academic Year</label>
                    <p>2026</p>
                </div>

                <div class="detail-item">
                    <label>Account Type</label>
                    <p>Student</p>
                </div>

                <div class="detail-item">
                    <label>Account Status</label>
                    <p>Active</p>
                </div>

            </div>

        </section>

    </main>













</body>
</html>
