<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St Genevieve Student portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- background photo -->
<img class="bg-photo" src="Images/student-bg.jpg" alt="Student-background image">
 
<!-- Left side  -->
<div class="hero">
  <p class="hero-brand">St Genevieve Academy</p>
  <h1>Study today.<br>Shine tomorrow.</h1>
  <p class="hero-text">Open your assignments, take quizzes and check your timetable from one place.</p>
</div>




  <div class="card">



    <!-- Switching between forms  -->

 <input type="radio" name="tab" id="login" checked>
    <input type="radio" name="tab" id="register">
 
    <div class="tabs">
      <label for="login">Log in</label>
      <label for="register">Register</label>
    </div>

    <!-- log in form  -->
      <form class="login-form" id="loginForm">
      <h2>Welcome back</h2>
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit">Log in</button>
      <p id="loginMessage" class="message"></p>
    </form>



<!-- register form  -->


<form class="register-form" id="registerForm">
      <h2>Create your account</h2>
   <input type="text" id="regName" placeholder="Your name" required>

<input type="email" id="regEmail" placeholder="Email" required>

<input type="password" id="regPassword" placeholder="Password" required>
<div class="select-grade"> 
   <select id="regGrade" class="style-inside" required>
    <option value="">Select grade</option>
    <option value="Grade 7">Grade 1</option>
    <option value="Grade 7">Grade 2</option>
    <option value="Grade 7">Grade 3</option>
    <option value="Grade 7">Grade 4</option>
    <option value="Grade 7">Grade 5</option>
    <option value="Grade 7">Grade 6</option>
    <option value="Grade 7">Grade 7</option>
    <option value="Grade 8">Grade 8</option>
    <option value="Grade 9">Grade 9</option>
    <option value="Grade 7">Grade 10</option>
    <option value="Grade 7">Grade 11</option>
</select>
</div>
      <button type="submit">Create account</button>
      <p id="registerMessage" class="message"></p>

    </form>
 
 

<script src="script.js" defer></script>

  </div>









</body>
</html>
