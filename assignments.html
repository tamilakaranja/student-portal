<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments</title>
    <link rel="stylesheet" href="assignments.css">
</head>
<body>



    <!-- top-bar  -->
   <header class="topbar">
        <div class="dashboard-logo">
            <img src="Images/logo.png" alt="School logo">
            <div>
                <div class="school-name">St Genevieve Academy</div>
                <div class="sub-name">Students portal</div>
            </div>
        </div>  


        <!-- actions  -->
           <div class="top-bar-actions">
            <a href="profile.html">My profile</a>
          <a href="index.html" id="signout">Sign out</a>
        </div>
    </header>
<main class="dashboard">
    <!-- back to dashboard  -->
  <a href="dashboard.html" class="back-link"> Back to dashboard</a>
        <h1 id="gradeLabel">Assignments</h1>
    
        <!-- filter buttons  . -->
          <div class="filters">
          <button type="button" class="active" data-filter="all">All</button>
            <button type="button" class="filter" data-filter="to-do">To do</button>
            <button type="button" class="filter" data-filter="submitted">Submitted</button>
            <button type="button" class="filter" data-filter="overdue">Overdue</button>
        </div>
<select id="subjectFilter">
    <option value="all">All subjects</option>
</select>
        <!-- assignment list  -->
        
    <div class="assignment-list" id="assignmentList"></div>
<p id="emptyMessage" hidden>

</p>
</div>

            </main>

<!-- assignment poop ups  -->

<div class="modal modal-hide" id="assignmentmodal">
    <div class="modal-box">
        <button type="button" class="modal-close" id="modalClose">close</button>

        <p class="subject" id="modalsubject"></p>
        <h2 id="modaltitle"></h2>
        <p class="due" id="modaldue"></p>
        <p class="details" id="modaldetails"></p>

        <form id="assignmentform">
            <div id="modalquestions"></div>
            <p class="form-error" id="formError"></p>
            <button type="submit" class="open-btn" id="submitbtn">Submit assignment</button>
        </form>

        <div class="successhide" id="successmsg">
             <h3>Submitted</h3>
           <p id="resultScore"></p>
<div id="reviewList"></div>
            <button type="button" class="open-btn" id="successClose">Close</button>
</div>
    </div>
</div>

<script src="assignments.js"></script>
            
</body>
</html>
